<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta
      name="description"
      content="Portfolio site for Sylas Horowitz"
    />
    <!-- Open Graph / LinkedIn meta tags -->
    <meta property="og:title" content="Engineering | Sylas Horowitz" />
    <meta property="og:description" content="Selected engineering projects, notes, and work." />
    <meta property="og:url" content="https://www.sylashorowitz.com/engineering" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sylas Horowitz" />
    <!-- TODO: Replace with a 1200x627px image for better LinkedIn preview -->
    <meta property="og:image" content="https://www.sylashorowitz.com/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engineering | Sylas Horowitz" />
    <meta name="twitter:description" content="Selected engineering projects, notes, and work." />
    <meta name="twitter:image" content="https://www.sylashorowitz.com/logo512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load only essential fonts, use font-display=swap for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Preload critical font - path will be resolved by Vite during build -->
    <link rel="preload" href="/src/assets/fonts/Sketch Book.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <!-- Preload background image with highest priority - must match public folder path -->
    <link rel="preload" href="/assets/images/backgrounds/paper1-optim.jpg" as="image" type="image/jpeg" fetchpriority="high" />
    <title>Sylas Horowitz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
